# Everything in one conda environment: Cellpose (with its window) + the analysis scripts.
#   conda env create -f environment.yml
#   conda activate cellpose
name: cellpose
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - cellpose[gui]==4.2.1.1   # same version as the Colab notebook -> same ROIs
      - roifile
      - tifffile
      - scipy
      - numpy>=1.24
      - pandas>=2.0
      - matplotlib>=3.7
      - openpyxl>=3.1
